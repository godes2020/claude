    item_model: spectra_aurelium_skills:skill_flag
    display_name: ''
    amount: 1
    glow: false
  job:
    view_conditions:
    - placeholder: '%auraskills_jobs_active_{skill}%'
      value: 'true'
    pos: 0,8
    material: BRICK
    item_model: spectra_aurelium_skills:job_icon_enabled
    display_name: <#FFD738>{{job}}
    lore:
    - ''
    - text: '<gray> ▪ {{job_desc}}'
      wrap: true
      style: <gray>
    - ' '
    - component: job_select
    - component: job_active
    - component: job_limit
    - component: job_cooldown
  job(1):
    view_conditions:
    - placeholder: '%auraskills_jobs_active_{skill}%'
      value: 'false'
    pos: 0,8
    material: BRICK
    item_model: spectra_aurelium_skills:job_icon_off
    display_name: <#FFD738>{{job}}
    lore:
    - ''
    - text: '<gray> ▪ {{job_desc}}'
      wrap: true
      style: <gray>
    - ' '
    - component: job_select
    - component: job_active
    - component: job_limit
  # close:
  #   pos: 5,1
