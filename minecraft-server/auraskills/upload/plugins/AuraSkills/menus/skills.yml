templates:
  skill:
    contexts:
      archery:
        pos: 23
        material: brick
        item_model: spectra_aurelium_skills:skill_archery
      fighting:
        pos: 15
        material: brick
        item_model: spectra_aurelium_skills:skill_fighting
      defense:
        pos: 24
        material: brick
        item_model: spectra_aurelium_skills:skill_defence
      farming:
        pos: 30
        material: brick
        item_model: spectra_aurelium_skills:skill_farming
      foraging:
        pos: 32
        material: brick
        item_model: spectra_aurelium_skills:skill_foraging
      mining:
        pos: 11
        material: brick
        item_model: spectra_aurelium_skills:skill_mining
      agility:
        pos: 21
        material: brick
        item_model: spectra_aurelium_skills:skill_agility
      alchemy:
        pos: 12
        material: brick
        item_model: spectra_aurelium_skills:skill_alchemy
      enchanting:
        pos: 14
        material: brick
        item_model: spectra_aurelium_skills:skill_enchanting
      fishing:
        pos: 29
        material: brick
        item_model: spectra_aurelium_skills:skill_fishing
      excavation:
        pos: 20
        material: brick
        item_model: spectra_aurelium_skills:skill_excavation
    groups:
      first_row:
        start: 1,0
        end: 1,7
        align: right
      second_row:
        start: 2,0
        end: 2,7
        align: right
      third_row:
        start: 3,0
        end: 3,7
        align: right
    display_name: <bold><white>{skill} <#82CD47>Ур. {level}
    lore:
    - text: '{desc}'
      wrap: true
      style: <gray>
    - component: stats_leveled
    - component: ability_levels
    - component: mana_ability_info
    - component: skill_job_active
    - ' '
    - component: progress
    - component: max_level
    - ' '
    - <gray>{{skill_click}}
components:
  stats_leveled:
    context: Skill
    lore:
    - ' '
    - ' <gray>{{stats_leveled}}:'
    - '   {entries[<gray>\n   ]}'
  ability_levels:
    context: Skill
    lore:
    - ' '
    - ' <gray>{{ability_levels}}:{entries[  ]}'
  mana_ability_info:
    context: Skill
    lore:
    - ' '
    - ' <gray>{{mana_ability}}: \n   <#6574cd>{name} {level}'
    - '   {entries[\n   ]}'
  progress:
    context: Skill
    lore:
    - ' <gray>▪ {{progress_to_level}} {next_level}'
    - '   {bar}'
    - '   <gray>{current_xp}/{level_xp} {xp_unit}'
  max_level:
    context: Skill
    lore:
    - ' <gold>{{max_level}}'
  skill_job_active:
    context: Skill
    lore:
    - ''
    - ' <gray>▪ Профессия'
    - <gray>    ▸ <#82CD47>{{active_job}}
formats:
  stat_leveled_entry: <#82CD47>+ <white>{stat}<gray>
  unlocked_ability_entry: \n   <#82CD47>+ <white>{name} <#86A7FC>{level} <dark_gray>({info})
  locked_ability_entry: \n   <bold><#DF2E38>x</bold> <dark_gray>{name}
  duration_entry: '<#82CD47>+ <white>{{duration}}: <#86A7FC>{duration} сек. '
  mana_cost_entry: '<#82CD47>+ <white>{{mana_cost}}: <#86A7FC>{mana_cost} '
  cooldown_entry: '<#82CD47>+ <white>{{cooldown}}: <#86A7FC>{cooldown} сек. '
  damage_entry: '<#82CD47>+ <white>{{damage}}: <#86A7FC>{value} '
  damage_per_mana_entry: '<#82CD47>+ <white>{{damage}}: <#e3342f>+{value}% / ед. маны '
  max_mana_cost_entry: '<#82CD47>+ <white>{{max_mana_cost}}: <#86A7FC>{mana_cost} '
  attack_speed_entry: '<#82CD47>+ <white>{{attack_speed}}: <#86A7FC>+{value}% '
  bar_completed: '<#ffd556><font:spectra_aurelium_skills:gui></font> '
  bar_current: '<#ffd556><font:spectra_aurelium_skills:gui></font> '
  bar_remaining: '<white><font:spectra_aurelium_skills:gui></font> '
options:
  bar_length: 10
  percent_format: '#.##'
  current_xp_format: '#.##'
file_version: 1
