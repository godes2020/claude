commands:
  prefix: "<dark_gray>[<aqua>Навыки<dark_gray>]<reset> "
  antiafk:
    failed: "<red>{player} не прошёл анти-АФК проверку {check} <gray>(раз: {count})"
    logs:
      header: "<gray>Анти-АФК логи игрока <red>{player} <gray>(всего {count}) <dark_gray>| <gray>Страница {page}/{total_pages}:"
      entry: "<gray>{timestamp} - {message}"
      desc: Показывает анти-АФК логи игрока.
  armor:
    modifier:
      add:
        added: "На броню добавлен модификатор характеристики: {stat}, значение: {value}, операция: {operation}"
        already_exists: "<yellow>На броне уже есть модификатор {color}{stat}<yellow>! Сначала удалите его: /sk armor modifier remove"
        desc: Добавляет модификатор характеристики на броню в руке (по умолчанию вместе с описанием).
      remove:
        does_not_exist: "<yellow>На предмете нет модификатора {color}{stat}<yellow>!"
        removed: "Модификатор {color}{stat} <gray>удалён с предмета"
        desc: Удаляет модификатор характеристики с брони в руке (по умолчанию вместе с описанием).
      list:
        header: "<white>Модификаторы брони:"
        desc: Показывает все модификаторы характеристик на броне в руке.
      removeall:
        removed: "<gray>Все модификаторы брони удалены с предмета"
        desc: Удаляет все модификаторы характеристик с брони в руке.
    trait:
      add:
        added: "На броню добавлен модификатор свойства: {trait}, значение: {value}, операция: {operation}"
        already_exists: "<yellow>На предмете уже есть модификатор свойства {trait}<yellow>! Сначала удалите его: /sk armor trait remove"
        desc: Добавляет модификатор свойства на броню в руке (по умолчанию вместе с описанием).
      remove:
        desc: Удаляет модификатор свойства с брони в руке.
      list:
        desc: Показывает все модификаторы свойств на предмете в руке.
      removeall:
        desc: Удаляет все модификаторы свойств с брони в руке.
    multiplier:
      add:
        added: "Множитель <aqua>{target} <gray>со значением <aqua>{value} <gray>добавлен на предмет"
        already_exists: "<yellow>На броне уже есть множитель для <aqua>{target}<yellow>! Сначала удалите его: /sk armor multiplier remove"
        skill_lore: "<gray>Если надето: <aqua>+{value}% опыта {skill}"
        skill_lore_subtract: "<gray>Если надето: <aqua>-{value}% опыта {skill}"
        global_lore: "<gray>Если надето: <blue>+{value}% опыта навыков"
        global_lore_subtract: "<gray>Если надето: <blue>-{value}% опыта навыков"
        desc: Добавляет на броню в руке множитель опыта для всех навыков или одного навыка (значение — процент прибавки).
      remove:
        does_not_exist: "<yellow>На предмете нет множителя брони для <aqua>{target}<yellow>!"
        removed: "Множитель брони <aqua>{target} <gray>удалён с предмета"
        desc: Удаляет с предмета в руке множитель для навыка или общий множитель.
      list:
        header: "<white>Множители брони:"
        desc: Показывает все множители брони на предмете в руке.
